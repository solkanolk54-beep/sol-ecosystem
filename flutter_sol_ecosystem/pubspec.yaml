name: sol_ecosystem
description: "SOL Ecosystem - Smart Agriculture and Livestock Management Mobile Platform"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # State Management & Service Locator
  provider: ^6.1.2
  flutter_bloc: ^8.1.3
  # Networking & HTTP
  http: ^1.2.1
  dio: ^5.4.1
  # Image Picker & Camera Scanning
  image_picker: ^1.0.7
  mobile_scanner: ^5.1.1
  camera: ^0.10.5+9
  # UI & Charts & QR
  qr_flutter: ^4.1.0
  google_fonts: ^6.1.0
  fl_chart: ^0.66.2
  cached_network_image: ^3.3.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
