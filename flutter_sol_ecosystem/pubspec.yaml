name: sol_ecosystem
description: "SOL Ecosystem - Smart Agriculture and Livestock Management Mobile Platform"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # State Management & DI
  provider: ^6.1.2
  flutter_bloc: ^8.1.3
  # Networking & Serialization
  http: ^1.2.1
  dio: ^5.4.1
  # UI & Charts
  google_fonts: ^6.1.0
  fl_chart: ^0.66.2
  lucide_icons: ^0.257.0
  intl: ^0.19.0
  # Camera & QR
  camera: ^0.10.5+9
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.1
  cached_network_image: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
